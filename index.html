<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alex">
<meta name="theme-color" content="#12212f">
<title>Alex · Entreno &amp; Salud</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#12212f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .frame{position:fixed;top:env(safe-area-inset-top);left:0;width:100%;
    height:calc(100% - 60px - env(safe-area-inset-top));border:0;display:none;background:#fff;-webkit-overflow-scrolling:touch}
  #loadmsg{position:fixed;top:44%;left:0;right:0;text-align:center;color:#6d7a76;font-size:14px;padding:0 24px}
  .frame.on{display:block}
  #bar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#12212f}
  #bar button{flex:1;border:0;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700;
    color:#cdd8e2;background:transparent;cursor:pointer;transition:background .15s}
  #bar button.on{background:#fff;color:#12212f}
</style>
</head>
<body>
  <iframe id="fEntreno" class="frame on" src="diario-de-fuerza-portable.html" title="Entreno"></iframe>
  <iframe id="fSalud" class="frame" src="Salud_Nutricion.html" title="Salud"></iframe>
  <nav id="bar">
    <button id="bEntreno" class="on" onclick="show('Entreno')">🏋️ Entreno</button>
    <button id="bSalud" onclick="show('Salud')">🌿 Salud</button>
  </nav>
<script>
  function show(w){
    ['Entreno','Salud'].forEach(function(x){
      document.getElementById('f'+x).classList.toggle('on', x===w);
      document.getElementById('b'+x).classList.toggle('on', x===w);
    });
    try{localStorage.setItem('alex_shell_tab',w);}catch(e){}
  }
  try{var t=localStorage.getItem('alex_shell_tab'); if(t){show(t);}}catch(e){}
</script>
</body>
</html>
